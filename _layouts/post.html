---
layout: default
---
<article class="pt-24 pb-16 px-4 sm:px-6 lg:px-8 max-w-3xl mx-auto bg-gray-50">
    <header class="mb-8 text-center">
        <p class="text-sm text-gray-500 mb-2">{{ page.date | date: "%B %-d, %Y" }}</p>
        <h1 class="text-3xl font-bold text-navy-900">{{ page.title }}</h1>
        {% if page.tags.size > 0 %}
        <div class="flex flex-wrap justify-center gap-2 mt-4">
            {% for tag in page.tags %}
            <span class="px-3 py-1 bg-navy-50 text-navy-900 border border-navy-100 text-sm rounded-md">{{ tag }}</span>
            {% endfor %}
        </div>
        {% endif %}
    </header>
    <div class="bg-white rounded-xl p-6 sm:p-10 shadow-md prose max-w-none prose-headings:text-navy-900 prose-a:text-navy-900">
        {{ content }}
    </div>
    <div class="mt-8 text-center">
        <a href="{{ '/blog/' | relative_url }}" class="text-navy-900 font-medium hover:underline">&larr; Back to Blog</a>
    </div>
</article>
