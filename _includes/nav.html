<nav class="fixed w-full bg-white shadow-sm z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <span class="text-xl font-bold gradient-text">{{ site.author | default: "Khairi Abidi" }}</span>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                {% for item in site.data.site.nav %}
                <a href="#{{ item.anchor }}" class="animated-underline font-medium">{{ item.label }}</a>
                {% endfor %}
            </div>
            <div class="md:hidden flex items-center">
                <button id="menu-btn" class="text-gray-500 hover:text-gray-900 focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-white pb-3 px-4 shadow-lg">
        {% for item in site.data.site.nav %}
        <a href="#{{ item.anchor }}" class="block py-2 font-medium">{{ item.label }}</a>
        {% endfor %}
    </div>
</nav>
