{% assign about = site.data.site.about %}
<!-- About Section -->
<section id="about" class="py-16 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto bg-white rounded-xl shadow-sm">
    <div class="text-center mb-12">
        <h2 class="text-3xl font-bold mb-2">About Me</h2>
        <div class="w-20 h-1 bg-gradient-to-r from-blue-500 to-green-400 mx-auto"></div>
    </div>
    <div class="flex flex-col md:flex-row items-center">
        <div class="md:w-1/3 mb-8 md:mb-0 flex justify-center">
            <div class="w-48 h-48 rounded-full overflow-hidden border-4 border-white shadow-lg">
                <img src="{{ about.image }}"
                     alt="{{ site.author }}"
                     class="w-full h-full object-cover">
            </div>
        </div>
        <div class="md:w-2/3 md:pl-12">
            {% for paragraph in about.paragraphs %}
            <p class="text-lg text-gray-700 mb-6">
                {{ paragraph }}
            </p>
            {% endfor %}
        </div>
    </div>
</section>
