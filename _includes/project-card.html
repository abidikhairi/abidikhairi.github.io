<div class="project-card bg-white rounded-xl overflow-hidden shadow-md transition duration-300">
    <div class="h-48 bg-gradient-to-r {{ include.project.gradient }} flex items-center justify-center">
        <i class="{{ include.project.icon }} text-white text-6xl"></i>
    </div>
    <div class="p-6">
        <h3 class="text-xl font-bold mb-2">{{ include.project.title }}</h3>
        <p class="text-gray-600 mb-4">{{ include.project.description }}</p>
        <div class="flex flex-wrap gap-2 mb-4">
            {% for tag in include.project.tags %}
            <span class="px-3 py-1 bg-{{ tag.color }}-100 text-{{ tag.color }}-800 text-sm rounded-full">{{ tag.label }}</span>
            {% endfor %}
        </div>
        <a href="{{ include.project.link }}" class="text-blue-600 font-medium hover:underline">View Project →</a>
    </div>
</div>
