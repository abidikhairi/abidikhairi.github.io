<!-- Projects Section -->
<section id="projects" class="py-16 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto bg-gray-50">
    <div class="text-center mb-12">
        <h2 class="text-3xl font-bold mb-2">Featured Projects</h2>
        <div class="w-20 h-1 bg-gradient-to-r from-blue-500 to-green-400 mx-auto"></div>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for project in site.data.projects %}
        {% include project-card.html project=project %}
        {% endfor %}
    </div>
    <div class="text-center mt-10">
        <a href="#" class="inline-block px-6 py-3 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition duration-300">
            View All Projects
        </a>
    </div>
</section>
