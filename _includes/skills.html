{% assign skills = site.data.skills %}
<!-- Skills Section -->
<section id="skills" class="pt-24 pb-16 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto">
    <div class="text-center mb-12">
        <h2 class="text-3xl font-bold mb-2">Technical Skills</h2>
        <div class="w-20 h-1 bg-navy-900 mx-auto"></div>
    </div>

    <!-- Core Skills -->
    <div class="bg-white p-8 rounded-xl shadow-sm mb-8">
        <h3 class="text-2xl font-semibold mb-6 text-navy-900">Core Competencies</h3>
        <div class="flex flex-wrap gap-3">
            {% for skill in skills.core %}
            <div class="skill-pill px-4 py-2 border border-navy-900 text-navy-900 rounded-md font-medium transition duration-200 hover:bg-navy-900 hover:text-white">{{ skill }}</div>
            {% endfor %}
        </div>
    </div>

    <!-- Technical Tools -->
    <div class="grid md:grid-cols-2 gap-8">
        {% for group in skills.tools %}
        <div class="bg-white p-8 rounded-xl shadow-sm">
            <h3 class="text-xl font-semibold mb-4 text-navy-900">{{ group.category }}</h3>
            <div class="flex flex-wrap gap-2">
                {% for item in group.items %}
                <span class="px-3 py-1 bg-navy-50 text-navy-900 border border-navy-100 text-sm rounded-md">{{ item }}</span>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</section>
