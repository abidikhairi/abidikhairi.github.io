{% assign hero = site.data.site.hero %}
<!-- Hero Section -->
<section class="pt-24 pb-16 md:pt-32 md:pb-24 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row items-center">
        <div class="md:w-1/2 mb-10 md:mb-0">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">{{ hero.greeting }} <span class="wave">👋</span></h1>
            <h2 class="text-2xl md:text-3xl font-semibold mb-6 gradient-text">{{ hero.role }}</h2>
            <p class="text-lg text-gray-600 mb-8">
                {{ hero.description }}
            </p>
            <div class="flex space-x-4">
                <a href="#contact" class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition duration-300">
                    Get In Touch
                </a>
                <a href="#projects" class="px-6 py-3 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition duration-300">
                    View Projects
                </a>
            </div>
        </div>
        <div class="md:w-1/2 flex justify-center">
            <div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full overflow-hidden border-4 border-white shadow-xl">
                <img src="{{ hero.image }}"
                     alt="{{ site.author }}"
                     class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-blue-600 to-transparent opacity-20"></div>
            </div>
        </div>
    </div>
</section>
