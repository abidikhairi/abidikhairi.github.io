<footer class="bg-gray-900 text-white py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center">
            <div class="mb-6 md:mb-0">
                <span class="text-xl font-bold gradient-text">{{ site.author }}</span>
                <p class="text-gray-400 mt-2">{{ site.data.site.footer.tagline }}</p>
            </div>
            <div class="flex space-x-6">
                {% for link in site.data.site.social %}
                <a href="{{ link.url }}" class="text-gray-400 hover:text-white transition duration-300">
                    <i class="{{ link.icon }} text-xl"></i>
                </a>
                {% endfor %}
            </div>
        </div>
        <div class="border-t border-gray-800 mt-8 pt-8 text-center text-gray-400">
            <p>{{ site.data.site.footer.copyright }}</p>
        </div>
    </div>
</footer>
