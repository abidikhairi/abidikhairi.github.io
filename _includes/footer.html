<footer class="bg-black text-white py-6 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="text-center md:text-left">
                <span class="text-lg font-bold text-white">{{ site.author }}</span>
                <span class="text-gray-400 text-sm md:ml-2">{{ site.data.site.footer.tagline }}</span>
            </div>
            <div class="flex space-x-5">
                {% for link in site.data.site.social %}
                <a href="{{ link.url }}" class="text-gray-400 hover:text-white transition duration-300">
                    <i class="{{ link.icon }} text-lg"></i>
                </a>
                {% endfor %}
            </div>
        </div>
        <div class="border-t border-gray-800 mt-4 pt-4 text-center text-gray-400 text-sm">
            <p>{{ site.data.site.footer.copyright }}</p>
        </div>
    </div>
</footer>
